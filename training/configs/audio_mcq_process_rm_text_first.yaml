### model
model_name_or_path: ../pretrained_models/Fun-Audio-Chat-8B
adapter_name_or_path: saves/Fun-Audio-Chat-8B/audio_mcq_qlora_sft_text_first
trust_remote_code: true
flash_attn: fa2
quantization_bit: 4
double_quantization: true
quantization_type: nf4
print_param_status: true

### method
stage: rm
do_train: true
do_eval: false
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
upcast_layernorm: true

### dataset
dataset: audio-mcq-strongac-process-rm-text-first
template: funaudiochat
cutoff_len: 3072
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: saves/Fun-Audio-Chat-8B/audio_mcq_process_rm_text_first
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
